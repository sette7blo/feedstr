<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Feedstr</title>
  <meta name="description" content="Multi-column Nostr feed reader." />
  <meta name="theme-color" content="#040208" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="dark" />
  <style>
    html, body { background: #040208; color: #f4efff; }
  </style>
  <meta name="format-detection" content="telephone=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Feedstr" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest?v=mobile-pass-6" />
  <link rel="icon" type="image/x-icon" href="./favicon.ico?v=feedstr-fd-logo" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png?v=feedstr-fd-logo" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=feedstr-fd-logo" />
  <link rel="stylesheet" href="./styles.css?v=search-polish-1" />
</head>
<body>

<header class="mobile-topbar" aria-label="Feedstr mobile navigation">
  <button class="mobile-menu-button" id="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-brand">
    <img class="brand-logo" src="./icons/header-logo.png?v=feedstr-fd-logo" width="26" height="26" alt="" />
    <span class="brand-name">Feed<span class="brand-name-accent">str</span></span>
  </div>
  <span class="mobile-topbar-spacer" aria-hidden="true"></span>
</header>
<div class="mobile-menu-backdrop" id="mobile-menu-backdrop"></div>

<div class="app">
  <!-- sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="brand-logo" src="./icons/header-logo.png?v=feedstr-fd-logo" width="34" height="34" alt="Feedstr" />
      <span class="brand-name">Feed<span class="brand-name-accent">str</span></span>
    </div>

    <nav class="sidebar-nav">
      <button class="sidebar-search-button" id="feedstr-search-btn" type="button" aria-label="Search Nostr profiles">
        <span class="sidebar-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <span>Search people</span>
      </button>
      <div class="sidebar-section">
        <span>Columns</span>
        <button class="section-add" id="add-column-btn" type="button" title="Add column" aria-label="Add column">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div id="column-list"></div>
    </nav>

    <div class="sidebar-compose">
      <button class="btn btn-primary compose-open-btn" id="compose-open-btn" type="button" aria-label="Compose a note">
        <span class="compose-open-icon" aria-hidden="true"></span>
        <span>Compose</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <button class="connection-chip" id="idenstr-settings-btn" type="button" title="Open Feedstr settings" aria-label="Open Feedstr settings">
        <span class="connection-chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.22.65.22 1H21a2 2 0 0 1 0 4h-1.38c0 .35-.08.69-.22 1z"/></svg></span>
        <span class="connection-chip-main">
          <span class="connection-chip-label">Settings</span>
          <span class="connection-chip-status" id="idenstr-summary">
            <span class="connection-dot"></span>
            <span class="connection-chip-text">Checking Idenstr&hellip;</span>
          </span>
        </span>
        <svg class="connection-chip-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="connection-chip zap-settings-chip" id="zap-settings-btn" type="button" title="Open zap settings" aria-label="Open zap settings">
        <span class="connection-chip-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
        <span class="connection-chip-main">
          <span class="connection-chip-label">Zap wallet</span>
          <span class="connection-chip-status" id="zap-wallet-chip" aria-live="polite">
            <span class="connection-dot"></span>
            <span class="connection-chip-text">checking balance…</span>
          </span>
        </span>
        <svg class="connection-chip-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div class="sidebar-status" id="status-bar">
        <span class="dot"></span>Connecting...
      </div>
    </div>
  </aside>

  <!-- columns -->
  <div class="columns" id="columns"></div>
</div>

<!-- floating compose button (legacy mobile trigger, hidden when the bottom nav is active) -->
<button class="compose-fab" id="compose-fab" type="button" aria-label="Compose a note">
  <span class="compose-fab-icon" aria-hidden="true"></span>
</button>

<nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Feedstr primary mobile navigation">
  <button class="mobile-bottom-item" id="mobile-nav-home" type="button" data-mobile-nav="home" aria-label="Open Home feed">
    <span class="mobile-bottom-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
    <span>Home</span>
  </button>
  <button class="mobile-bottom-item" id="mobile-nav-feeds" type="button" data-mobile-nav="feeds" aria-label="Choose Feedstr columns">
    <span class="mobile-bottom-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
    <span>Feeds</span>
  </button>
  <button class="mobile-bottom-compose" id="mobile-nav-compose" type="button" aria-label="Compose a note">
    <span class="mobile-bottom-compose-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span>
    <span>Post</span>
  </button>
  <button class="mobile-bottom-item" id="mobile-nav-notifications" type="button" data-mobile-nav="notifications" aria-label="Open Notifications">
    <span class="mobile-bottom-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
    <span>Alerts</span>
  </button>
  <button class="mobile-bottom-item" id="mobile-nav-search" type="button" data-mobile-nav="search" aria-label="Search Nostr profiles">
    <span class="mobile-bottom-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <span>Search</span>
  </button>
</nav>

<!-- add column modal -->
<div class="modal-overlay" id="add-column-modal">
  <div class="modal" id="modal-content">
    <!-- populated by JS -->
  </div>
</div>

<div class="toast-host" id="toast-host" aria-live="polite" aria-atomic="false"></div>

<!-- compose modal -->
<div class="modal-overlay" id="compose-modal">
  <div class="modal compose-modal-card">
    <div class="compose-head">
      <span class="compose-label">Compose</span>
      <div class="compose-head-right">
        <span class="compose-at-hint" title="Type @ to mention a follow">@ to mention</span>
        <button class="compose-close-btn" id="compose-close-btn" type="button" aria-label="Close composer"></button>
      </div>
    </div>
    <div class="compose-identity" id="compose-identity" aria-label="Posting identity">
      <div class="compose-identity-avatar note-avatar"></div>
      <div class="compose-identity-copy">
        <span class="compose-identity-label">Posting as</span>
        <strong>Loading identity...</strong>
        <small></small>
      </div>
    </div>
    <div class="compose-input-wrap">
      <textarea id="compose-text" placeholder="Share an update&hellip;" aria-describedby="compose-helper"></textarea>
      <div class="mention-suggest hidden" id="compose-mention-suggest" role="listbox" aria-label="Mention suggestions"></div>
    </div>
    <div class="compose-helper-row" id="compose-helper">
      <span>Attach images, paste a nostr note to quote, or type @ to tag a follow.</span>
      <span class="compose-count" id="compose-count">0</span>
    </div>
    <div class="compose-preview hidden" id="compose-preview" aria-label="Attachment preview"></div>
    <div class="compose-tags hidden" id="compose-tags" aria-label="Tagged people"></div>
    <div class="compose-media-status hidden" id="compose-media-status" role="status" aria-live="polite"></div>
    <div class="schedule-list-section compose-schedule-list-section">
      <div class="subsection-head"><span>Scheduled queue</span><button class="btn btn-ghost btn-mini" id="schedule-refresh" type="button">Refresh</button></div>
      <div id="schedule-list" class="schedule-list"></div>
    </div>
    <div class="compose-actions">
      <input class="compose-media-input" id="compose-media-input" type="file" accept="image/*" hidden aria-hidden="true" tabindex="-1" />
      <button class="btn btn-ghost btn-sm compose-media-btn" id="compose-media-btn" type="button" title="Insert photo" aria-label="Insert photo from this device">
        <span class="compose-media-icon" aria-hidden="true"></span>
        <span class="compose-media-text">Photo</span>
      </button>
      <button class="btn btn-ghost btn-sm compose-schedule-btn" id="compose-schedule-btn" type="button" title="Schedule post" aria-label="Schedule post">
        <span class="compose-schedule-icon" aria-hidden="true"></span>
        <span class="compose-schedule-text">Schedule</span>
      </button>
      <button class="btn btn-primary btn-sm" id="compose-send" disabled>Post</button>
    </div>
  </div>
</div>

<!-- schedule modal -->
<div class="modal-overlay" id="schedule-modal">
  <div class="modal schedule-modal-card">
    <div class="compose-head">
      <span class="compose-label">Schedule post</span>
      <button class="compose-close-btn" id="schedule-close-btn" type="button" aria-label="Close scheduler"></button>
    </div>
    <form class="schedule-form" id="schedule-form">
      <div class="schedule-timezone" id="schedule-timezone">Uses your local timezone</div>
      <label class="field">
        <span>Date and time</span>
        <input id="schedule-datetime" name="scheduledLocal" type="datetime-local" required />
      </label>
      <div id="schedule-status" class="compose-media-status hidden" role="status" aria-live="polite"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="schedule-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="schedule-submit" type="submit">Schedule</button>
      </div>
    </form>
  </div>
</div>

<script defer src="./app/state.js?v=quotes-1"></script>
<script defer src="./app/icons.js?v=people-search-1"></script>
<script defer src="./app/helpers.js?v=media-pass-9"></script>
<script defer src="./app/boot.js?v=following-npub-1"></script>
<script defer src="./app/relays.js?v=quotes-1"></script>
<script defer src="./app/events.js?v=quotes-1"></script>
<script defer src="./app/profiles.js?v=schedule-open-2"></script>
<script defer src="./app/columns.js?v=side-menu-polish-1"></script>
<script defer src="./app/column-feed.js?v=split-2"></script>
<script defer src="./app/notifications.js?v=quotes-1"></script>
<script defer src="./app/notes.js?v=split-2"></script>
<script defer src="./app/threads.js?v=nested-threads-1"></script>
<script defer src="./app/interactions.js?v=frontend-split-2"></script>
<script defer src="./app/compose.js?v=schedule-queue-1"></script>
<script defer src="./app/overlays.js?v=side-menu-polish-1"></script>
<script defer src="./app/search.js?v=search-polish-1"></script>
<script defer src="./app/add-column.js?v=split-2"></script>
<script defer src="./app/follow.js?v=split-2"></script>
<script defer src="./app/column-store.js?v=split-2"></script>
<script defer src="./app/mutes.js?v=split-2"></script>
<script defer src="./app/counts-cache.js?v=schedule-open-1"></script>
<script defer src="./app/init.js?v=frontend-split-2"></script>

</body>
</html>
